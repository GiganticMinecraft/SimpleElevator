name: Validate Renovate config
on:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate.yaml"
      - "mise.toml"
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/renovate.yaml"
      - "mise.toml"
permissions: {}
jobs:
  validate:
    name: Validate configuration
    timeout-minutes: 3
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.11'
          cache: true
      - name: Validate Renovate configuration
        id: renovate
        continue-on-error: true
        run: mise run --raw validate-renovate
      - name: Generate report
        if: github.event_name == 'pull_request'
        env:
          RENOVATE_OUTCOME: ${{ steps.renovate.outcome }}
        run: |
          {
            echo '<!-- renovate -->'
            if [[ "$RENOVATE_OUTCOME" == "success" ]]; then
              echo '## :white_check_mark: Renovate — configuration is valid'
            else
              echo '## :warning: Renovate — configuration validation failed'
              echo
              echo 'See the workflow logs for details.'
            fi
          } | tee /tmp/renovate-result.md
      - name: Find existing PR comment
        if: github.event_name == 'pull_request'
        id: fc
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "<!-- renovate -->"
      - name: Create or update PR comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: /tmp/renovate-result.md
          edit-mode: replace
      - name: Fail on issues
        if: always() && steps.renovate.outcome == 'failure'
        run: exit 1
