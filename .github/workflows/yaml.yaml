name: Lint yaml
on:
  push:
    branches:
      - main
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/.yamllint.yaml"
      - "mise.toml"
  pull_request:
    paths:
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/.yamllint.yaml"
      - "mise.toml"
permissions: {}
jobs:
  lint:
    name: Lint YAML
    timeout-minutes: 3
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.3'
          cache: true
      - name: Lint YAML
        run: mise run --raw lint-yaml
